[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blast-radius"
version = "0.1.0"
description = "Explainable conference incident coordination on FalkorDB"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "falkordb>=1.1,<3",
  "openai>=1.80,<4",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]
lite = ["falkordblite>=0.10,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["static/*"]
